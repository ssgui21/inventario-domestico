name: Compilar APK Android (InventarioDomestico)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar e Gerar APK Instalável
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Workload MAUI Android
        run: dotnet workload install maui-android

      - name: Executar Testes Automatizados (xUnit)
        shell: pwsh
        run: |
          $testProj = Get-ChildItem -Recurse -Filter "*Tests.csproj" | Select-Object -First 1
          if ($testProj) {
            Write-Host "Executando testes em: $($testProj.FullName)"
            dotnet test $testProj.FullName --configuration Release --verbosity normal -p:CheckEolWorkloads=false -p:CheckEolTargetFramework=false -p:NoWarn=NETSDK1202
          } else {
            Write-Host "Aviso: Pasta de testes não encontrada. Prosseguindo direto para gerar o APK..."
          }

      - name: Compilar e Gerar APK Android Assinado
        shell: pwsh
        run: |
          $appProj = Get-ChildItem -Recurse -Filter "*App.csproj" | Select-Object -First 1
          if (-not $appProj) {
            $appProj = Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object { $_.Name -notmatch "Tests" -and $_.Name -notmatch "Core" } | Select-Object -First 1
          }
          if (-not $appProj) {
            Write-Error "Projeto da aplicação MAUI (*App.csproj) não foi encontrado no repositório."
            Get-ChildItem -Recurse | Select-Object FullName
            exit 1
          }
          Write-Host "Compilando aplicativo MAUI: $($appProj.FullName)"
          dotnet publish $appProj.FullName -f net8.0-android -c Debug -p:AndroidPackageFormat=apk -p:CheckEolWorkloads=false -p:CheckEolTargetFramework=false -p:NoWarn=NETSDK1202 -p:MauiVersion=8.0.100

      - name: Localizar Arquivo APK Gerado
        id: find_apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter "*Signed.apk" | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Recurse -Filter "*.apk" | Select-Object -First 1
          }
          if ($apk) {
            Write-Host "APK encontrado com sucesso: $($apk.FullName)"
            echo "apk_path=$($apk.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Nenhum arquivo APK foi gerado na saída da compilação."
            exit 1
          }

      - name: Disponibilizar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: InventarioDomestico-Android-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
