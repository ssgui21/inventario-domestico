name: Compilar APK Android (InventarioDomestico)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Release Instalável
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Forçar uso estrito do .NET 8
        shell: pwsh
        run: |
          echo "$env:DOTNET_ROOT" >> $env:GITHUB_PATH
          '{ "sdk": { "version": "8.0.100", "rollForward": "latestFeature" } }' | Set-Content -Path global.json -Encoding utf8
          dotnet --info

      - name: Instalar Workload MAUI Android
        run: dotnet workload install maui-android

      - name: Gerar Chave de Assinatura e Compilar APK Release
        shell: pwsh
        run: |
          # 1. Gerar chave com caminho absoluto
          $keystore = Join-Path (Get-Location) "app.keystore"
          keytool -genkeypair -v -keystore $keystore -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass senha123 -keypass senha123 -dname "CN=InventarioDomestico, O=App, C=BR"
          
          # 2. Localizar projeto App
          $appProj = Get-ChildItem -Recurse -Filter "*App.csproj" | Select-Object -First 1
          if (-not $appProj) {
            $appProj = Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object { $_.Name -notmatch "Tests" -and $_.Name -notmatch "Core" } | Select-Object -First 1
          }
          Write-Host "Compilando projeto em Release: $($appProj.FullName)"

          # 3. Compilar e assinar APK Release
          dotnet publish $appProj.FullName `
            -f net8.0-android `
            -c Release `
            -p:AndroidPackageFormat=apk `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$keystore" `
            -p:AndroidSigningStorePass=senha123 `
            -p:AndroidSigningKeyAlias=appkey `
            -p:AndroidSigningKeyPass=senha123 `
            -p:CheckEolWorkloads=false `
            -p:CheckEolTargetFramework=false `
            -p:NoWarn=NETSDK1202 `
            -p:MauiVersion=8.0.100

      - name: Localizar Arquivo APK Gerado
        id: find_apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter "*Signed.apk" | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Recurse -Filter "*.apk" | Select-Object -First 1
          }
          if ($apk) {
            Write-Host "APK Release encontrado com sucesso: $($apk.FullName)"
            echo "apk_path=$($apk.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Nenhum arquivo APK foi gerado na saída da compilação."
            exit 1
          }

      - name: Disponibilizar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: InventarioDomestico-Android-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
