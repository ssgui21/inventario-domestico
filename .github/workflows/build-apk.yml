name: Compilar APK Android (InventarioDomestico)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar e Gerar APK Instalável
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Workload MAUI Android
        run: dotnet workload install maui-android

      - name: Executar Testes Automatizados (xUnit)
        run: dotnet test tests/InventarioDomestico.Tests/InventarioDomestico.Tests.csproj --configuration Release --verbosity normal -p:CheckEolTargetFramework=false

      - name: Compilar e Gerar APK Android Assinado
        run: >
          dotnet publish src/InventarioDomestico.App/InventarioDomestico.App.csproj
          -f net8.0-android
          -c Debug
          -p:AndroidPackageFormat=apk
          -p:CheckEolTargetFramework=false
          -p:MauiVersion=8.0.100

      - name: Localizar Arquivo APK Gerado
        id: find_apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path src/InventarioDomestico.App/bin -Recurse -Filter "*Signed.apk" | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Path src/InventarioDomestico.App/bin -Recurse -Filter "*.apk" | Select-Object -First 1
          }
          if ($apk) {
            Write-Host "APK encontrado com sucesso: $($apk.FullName)"
            echo "apk_path=$($apk.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Nenhum arquivo APK foi gerado na saída da compilação."
            exit 1
          }

      - name: Disponibilizar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: InventarioDomestico-Android-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
